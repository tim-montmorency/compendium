<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" width="700" height="430" role="img" aria-label="Grille de 3 colonnes et 2 rangees avec ses lignes de grille numerotees de 1 a 4 horizontalement et de 1 a 3 verticalement, ainsi que leurs equivalents negatifs">
  <rect x="0" y="0" width="700" height="430" rx="10" fill="#ffffff"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

    <!-- cellules -->
    <g fill="#eef2f7">
      <rect x="96" y="96" width="148" height="98" rx="4"/>
      <rect x="256" y="96" width="148" height="98" rx="4"/>
      <rect x="416" y="96" width="148" height="98" rx="4"/>
      <rect x="96" y="206" width="148" height="98" rx="4"/>
      <rect x="256" y="206" width="148" height="98" rx="4"/>
      <rect x="416" y="206" width="148" height="98" rx="4"/>
    </g>

    <!-- item mis en evidence : grid-column 2 / 4  +  grid-row 1 / 2 -->
    <rect x="256" y="96" width="308" height="98" rx="4" fill="#f4b8a3" fill-opacity="0.75" stroke="#c2410c" stroke-width="2"/>
    <text x="410" y="151" text-anchor="middle" font-size="17" font-weight="600" fill="#7c2d12">grid-column: 2 / 4;</text>

    <!-- lignes de grille verticales -->
    <g stroke="#334155" stroke-width="2.5" stroke-dasharray="7 5">
      <line x1="90" y1="82" x2="90" y2="318"/>
      <line x1="250" y1="82" x2="250" y2="318"/>
      <line x1="410" y1="82" x2="410" y2="318"/>
      <line x1="570" y1="82" x2="570" y2="318"/>
    </g>
    <!-- lignes de grille horizontales -->
    <g stroke="#334155" stroke-width="2.5" stroke-dasharray="7 5">
      <line x1="82" y1="90" x2="578" y2="90"/>
      <line x1="82" y1="200" x2="578" y2="200"/>
      <line x1="82" y1="310" x2="578" y2="310"/>
    </g>

    <!-- pastilles numerotees : verticales, positif -->
    <g>
      <circle cx="90" cy="62" r="15" fill="#1d4ed8"/><text x="90" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>
      <circle cx="250" cy="62" r="15" fill="#1d4ed8"/><text x="250" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>
      <circle cx="410" cy="62" r="15" fill="#1d4ed8"/><text x="410" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>
      <circle cx="570" cy="62" r="15" fill="#1d4ed8"/><text x="570" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">4</text>
    </g>
    <!-- pastilles numerotees : verticales, negatif -->
    <g>
      <circle cx="90" cy="338" r="15" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="90" y="344" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">-4</text>
      <circle cx="250" cy="338" r="15" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="250" y="344" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">-3</text>
      <circle cx="410" cy="338" r="15" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="410" y="344" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">-2</text>
      <circle cx="570" cy="338" r="15" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="570" y="344" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">-1</text>
    </g>
    <!-- pastilles numerotees : horizontales, positif -->
    <g>
      <circle cx="58" cy="90" r="15" fill="#047857"/><text x="58" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>
      <circle cx="58" cy="200" r="15" fill="#047857"/><text x="58" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>
      <circle cx="58" cy="310" r="15" fill="#047857"/><text x="58" y="316" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>
    </g>
    <!-- pastilles numerotees : horizontales, negatif -->
    <g>
      <circle cx="602" cy="90" r="15" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="602" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">-3</text>
      <circle cx="602" cy="200" r="15" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="602" y="206" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">-2</text>
      <circle cx="602" cy="310" r="15" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="602" y="316" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">-1</text>
    </g>

    <!-- legende -->
    <g font-size="15" fill="#334155">
      <circle cx="112" cy="381" r="9" fill="#1d4ed8"/>
      <text x="130" y="386">lignes verticales &#8594; <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">grid-column</tspan>&#160;&#160;&#183;&#160;&#160;3 colonnes = <tspan font-weight="700" fill="#1d4ed8">4</tspan> lignes</text>
      <circle cx="112" cy="409" r="9" fill="#047857"/>
      <text x="130" y="414">lignes horizontales &#8594; <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">grid-row</tspan>&#160;&#160;&#183;&#160;&#160;2 rangées = <tspan font-weight="700" fill="#047857">3</tspan> lignes</text>
    </g>
  </g>
</svg>
