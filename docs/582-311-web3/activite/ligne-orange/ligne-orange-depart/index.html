<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ligne orange</title>
  </head>
  <body class="bg-nuit text-creme">

    <section class="h-screen grid place-items-center p-4 text-center text-xl opacity-60">Défilez vers le bas, puis arrêtez-vous entre deux stations ↓</section>

    <section id="ligne" class="h-screen grid grid-rows-[auto_1fr] justify-items-center gap-8 px-4 pt-8 pb-16">
      <h1 class="text-2xl font-bold text-ligne">Ligne orange</h1>

      <div id="piste">
        <!-- Les stations ne sont pas espacées également -->
        <div class="station" style="top: 0%"><span>Montmorency</span></div>
        <div class="station" style="top: 30%"><span>De la Concorde</span></div>
        <div class="station" style="top: 55%"><span>Cartier</span></div>
        <div class="station" style="top: 100%"><span>Henri-Bourassa</span></div>

        <!-- Le train : un cadre transparent de la hauteur de la piste, avec le wagon en haut -->
        <div id="train">
          <div id="wagon"></div>
        </div>
      </div>
    </section>

    <section class="h-screen grid place-items-center p-4 text-center text-xl opacity-60">Terminus 🚇</section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
