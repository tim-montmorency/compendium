<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Petit Chaperon rouge | Récit défilant (démo Web 5)</title>
  <meta name="description" content="Démo de récit défilant pour le projet Récit défilant du cours Web 5.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Composant Vue 1 : la barre de progression (Personne B) -->
  <div id="barre-progression" v-cloak>
    <div class="progression"
         :style="{ transform: 'scaleX(' + progress + ')' }"></div>
  </div>

  <!-- Composant Vue 2 : le navigateur de chapitres (Personne A) -->
  <div id="navigation" v-cloak>
    <nav class="chapitres-nav" aria-label="Chapitres">
      <ol>
        <li v-for="(chapter, index) in chapters" :key="chapter.id">
          <a :href="'#' + chapter.id"
             :class="{ actif: index === activeChapterIndex }"
             :aria-current="index === activeChapterIndex ? 'step' : null"
             @click.prevent="goTo(chapter.id)">
            <span class="chapitres-nav__numero">{{ chapter.numero }}</span>
            <span class="chapitres-nav__titre">{{ chapter.titre }}</span>
          </a>
        </li>
      </ol>
    </nav>
  </div>

  <header class="entete">
    <p class="surtitre">Un conte de Charles Perrault · 1697</p>
    <h1>Le Petit Chaperon rouge<span class="point">.</span></h1>
    <p class="consigne">Faites défiler pour commencer</p>
  </header>

  <!-- Les chapitres sont générés en JavaScript à partir de data/data.json -->
  <main id="recit" aria-live="polite"></main>

  <footer class="pied">
    <p>Démo du projet Récit défilant · Web 5 · Collège Montmorency</p>
    <p>Texte librement adapté du conte de Charles Perrault (domaine public). Crédits dans le README.</p>
  </footer>

  <!-- Librairies par CDN, sans build -->
  <!-- GSAP 3.13 : tous les plugins, dont DrawSVG, sont gratuits depuis cette version -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/DrawSVGPlugin.min.js"></script>
  <!-- Vue : version exacte, sur jsDelivr comme GSAP (unpkg est souvent lent) -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>

  <!-- type="module" : main.js importe les fichiers des chapitres.
       Live Server obligatoire (les modules ne marchent pas en file:///) -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
