<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-labelledby="chemins-titre" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="chemins-titre">Deux chemins vers la maison de la mère-grand : le loup prend le plus court, le Petit Chaperon rouge le plus long</title>
<!-- Les deux chemins : DrawSVG les dessine au défilement -->
<path id="chemin-long" d="M70 180 C 120 40, 210 40, 250 140 S 330 330, 400 300 S 470 60, 540 80 S 640 300, 730 180"
      fill="none" stroke="#E9E4D8" stroke-width="6" stroke-linecap="round"/>
<path id="chemin-court" d="M70 180 C 300 200, 500 160, 730 180"
      fill="none" stroke="#FF2B47" stroke-width="10" stroke-linecap="round"/>
<!-- Départ et arrivée -->
<g id="depart">
  <circle cx="70" cy="180" r="16" fill="#E9E4D8"/>
  <text x="70" y="235" fill="#A8A8A8" font-size="18" text-anchor="middle" font-family="Poppins, sans-serif">Le village</text>
</g>
<g id="arrivee">
  <polygon points="706,190 730,160 754,190" fill="#FF2B47"/>
  <rect x="712" y="190" width="36" height="28" fill="#E9E4D8"/>
  <text x="730" y="250" fill="#A8A8A8" font-size="18" text-anchor="middle" font-family="Poppins, sans-serif">La mère-grand</text>
</g>
<!-- Légende -->
<g id="legende" font-family="Poppins, sans-serif" font-size="18">
  <line x1="70" y1="320" x2="110" y2="320" stroke="#FF2B47" stroke-width="8" stroke-linecap="round"/>
  <text x="122" y="326" fill="#F2F2F2">Le loup : le plus court</text>
  <line x1="400" y1="320" x2="440" y2="320" stroke="#E9E4D8" stroke-width="5" stroke-linecap="round"/>
  <text x="452" y="326" fill="#F2F2F2">Le Chaperon : le plus long</text>
</g>
</svg>
