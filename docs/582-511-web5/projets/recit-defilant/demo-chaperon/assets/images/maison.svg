<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" role="img" aria-labelledby="maison-titre" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="maison-titre">La maison de la mère-grand</title>
<!-- Groupes nommés : GSAP cible chaque partie par son id ou sa classe -->
<g id="fumee" fill="#BDBDBD">
  <circle class="bouffee" cx="430" cy="80" r="16"/>
  <circle class="bouffee" cx="440" cy="60" r="20"/>
  <circle class="bouffee" cx="452" cy="36" r="24"/>
</g>
<rect id="cheminee" x="410" y="110" width="44" height="90" fill="#3A3A3A"/>
<polygon id="toit" points="80,250 300,90 520,250" fill="#FF2B47"/>
<rect id="murs" x="110" y="250" width="380" height="250" fill="#E9E4D8"/>
<rect id="fenetre" x="350" y="300" width="90" height="80" fill="#2B2D33"/>
<!-- La lumière : un calque jaune qu'on anime en opacité (pas en couleur) -->
<rect id="lumiere" x="350" y="300" width="90" height="80" fill="#FFC83D"/>
<g id="cadre-porte"><rect x="200" y="330" width="100" height="170" fill="#0A0A0A"/></g>
<!-- Les yeux du loup, dans le noir derrière la porte -->
<g id="yeux-porte" fill="#FFC83D">
  <ellipse cx="235" cy="390" rx="8" ry="5"/>
  <ellipse cx="265" cy="390" rx="8" ry="5"/>
</g>
<g id="porte"><rect x="200" y="330" width="100" height="170" fill="#8A5A3C"/><circle id="chevillette" cx="282" cy="420" r="7" fill="#FFC83D"/></g>
<rect id="sol" x="0" y="500" width="600" height="20" fill="#1A1B1F"/>
</svg>
