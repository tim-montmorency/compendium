<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="loup-titre" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="loup-titre">Le loup, dessiné trait par trait</title>
<!-- Chaque trait a la classe .loup-trait : DrawSVG les dessine un à un -->
<g id="loup-traits" fill="none" stroke="#E9E4D8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <!-- Contour de la tête -->
  <polygon class="loup-trait" points="100,30 160,118 200,108 240,118 300,30 292,150 335,222 272,292 200,362 128,292 65,222 108,150"/>
  <!-- Intérieur des oreilles -->
  <polyline class="loup-trait" points="100,30 132,128 160,118"/>
  <polyline class="loup-trait" points="300,30 268,128 240,118"/>
  <!-- Fourrure des joues -->
  <polyline class="loup-trait" points="108,150 152,204 128,292"/>
  <polyline class="loup-trait" points="292,150 248,204 272,292"/>
  <polyline class="loup-trait" points="65,222 152,204"/>
  <polyline class="loup-trait" points="335,222 248,204"/>
  <!-- Front et museau -->
  <polyline class="loup-trait" points="200,108 200,252"/>
  <polyline class="loup-trait" points="160,118 172,248 200,330 228,248 240,118"/>
  <!-- Truffe et gueule -->
  <polygon class="loup-trait" points="180,252 220,252 200,276"/>
  <polyline class="loup-trait" points="200,276 200,300 174,316"/>
  <polyline class="loup-trait" points="200,300 226,316"/>
  <!-- Contour des yeux -->
  <polygon class="loup-trait" points="134,196 168,186 178,206 146,210"/>
  <polygon class="loup-trait" points="266,196 232,186 222,206 254,210"/>
</g>
<!-- Les yeux s'allument après le dessin -->
<g id="loup-yeux" fill="#FFC83D">
  <circle class="loup-oeil" cx="158" cy="200" r="8"/>
  <circle class="loup-oeil" cx="242" cy="200" r="8"/>
</g>
</svg>
