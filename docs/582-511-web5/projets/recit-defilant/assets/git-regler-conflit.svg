<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 290" role="img" aria-label="Régler un conflit dans VS Code : Accept Current garde votre version, Accept Incoming garde celle qui arrive, Accept Both garde les deux, ou on écrit la bonne version à la main. Puis plus aucun marqueur, enregistrer, ajouter, commit, tester, push." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Régler un conflit dans VS Code : Accept Current garde votre version, Accept Incoming garde celle qui arrive, Accept Both garde les deux, ou on écrit la bonne version à la main. Puis plus aucun marqueur, enregistrer, ajouter, commit, tester, push.</title><rect width="980" height="290" rx="12" fill="#0A0A0A"/><rect x="20" y="20" width="225" height="200" rx="10" fill="#15161A" stroke="#2E3036"/><g transform="translate(44,44) scale(1.4)" fill="#F2F2F2"><path d="M12 2C6.5 2 2 6.5 2 12S6.5 22 12 22 22 17.5 22 12 17.5 2 12 2M12 20C7.59 20 4 16.41 4 12S7.59 4 12 4 20 7.59 20 12 16.41 20 12 20M16.59 7.58L10 14.17L7.41 11.59L6 13L10 17L18 9L16.59 7.58Z"/></g><text x="44" y="120" fill="#F2F2F2" font-family="Poppins, 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="700" text-anchor="start">Accept Current</text><text x="44" y="156" fill="#9A9A9A" font-family="Poppins, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="400" text-anchor="start">Garder votre</text><text x="44" y="178" fill="#9A9A9A" font-family="Poppins, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="400" text-anchor="start">version</text><rect x="261" y="20" width="225" height="200" rx="10" fill="#15161A" stroke="#2E3036"/><g transform="translate(285,44) scale(1.4)" fill="#F2F2F2"><g fill="none" stroke="#F2F2F2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3V15M7 10L12 15L17 10M4 20H20"/></g></g><text x="285" y="120" fill="#F2F2F2" font-family="Poppins, 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="700" text-anchor="start">Accept Incoming</text><text x="285" y="156" fill="#9A9A9A" font-family="Poppins, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="400" text-anchor="start">Garder la version</text><text x="285" y="178" fill="#9A9A9A" font-family="Poppins, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="400" text-anchor="start">qui arrive</text><rect x="502" y="20" width="225" height="200" rx="10" fill="#15161A" stroke="#2E3036"/><g transform="translate(526,44) scale(1.4)" fill="#F2F2F2"><g fill="none" stroke="#F2F2F2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3V9C6 12 12 12 12 15V21M18 3V9C18 12 12 12 12 15"/></g></g><text x="526" y="120" fill="#F2F2F2" font-family="Poppins, 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="700" text-anchor="start">Accept Both</text><text x="526" y="156" fill="#9A9A9A" font-family="Poppins, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="400" text-anchor="start">Garder les deux,</text><text x="526" y="178" fill="#9A9A9A" font-family="Poppins, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="400" text-anchor="start">l'une sous l'autre</text><rect x="743" y="20" width="225" height="200" rx="10" fill="#15161A" stroke="#2E3036"/><g transform="translate(767,44) scale(1.4)" fill="#F2F2F2"><path d="M20.71,7.04C21.1,6.65 21.1,6 20.71,5.63L18.37,3.29C18,2.9 17.35,2.9 16.96,3.29L15.12,5.12L18.87,8.87M3,17.25V21H6.75L17.81,9.93L14.06,6.18L3,17.25Z"/></g><text x="767" y="120" fill="#F2F2F2" font-family="Poppins, 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="700" text-anchor="start">À la main</text><text x="767" y="156" fill="#9A9A9A" font-family="Poppins, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="400" text-anchor="start">Écrire la bonne</text><text x="767" y="178" fill="#9A9A9A" font-family="Poppins, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="400" text-anchor="start">version vo