<?xml version="1.0" encoding="UTF-8"?>
<!-- Icône : Récit défilant (Web 5) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g fill="none" stroke="#bec1c6" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Fenêtre du navigateur -->
    <rect x="34" y="30" width="380" height="400" rx="28"/>
    <line x1="34" y1="104" x2="414" y2="104"/>
    <!-- Lignes de texte du récit -->
    <line x1="84" y1="352" x2="300" y2="352"/>
    <line x1="84" y1="392" x2="220" y2="392"/>
    <!-- Barre de défilement -->
    <line x1="472" y1="44" x2="472" y2="300"/>
  </g>
  <g fill="#bec1c6">
    <!-- Points de la barre de titre -->
    <circle cx="84" cy="67" r="13"/>
    <circle cx="126" cy="67" r="13"/>
    <circle cx="168" cy="67" r="13"/>
    <!-- Lune -->
    <circle cx="320" cy="162" r="26"/>
    <!-- Scène en calques (parallaxe) -->
    <path d="M62 300 L150 196 L214 262 L262 214 L386 300 Z" opacity="0.45"/>
    <path d="M62 300 C130 250 190 246 250 270 C310 292 350 282 386 262 L386 300 Z"/>
    <!-- Curseur de défilement -->
    <rect x="452" y="70" width="40" height="96" rx="20"/>
  </g>
  <!-- Flèches vers le bas -->
  <g fill="none" stroke="#bec1c6" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="432,372 472,412 512,372" transform="translate(-20 0)"/>
    <polyline points="432,430 472,470 512,430" transform="translate(-20 0)" opacity="0.45"/>
  </g>
</svg>
