<text x="40" y="52" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="4" fill="#A8A8A8">DÉROULEMENT · UN CYCLE = 11 MIN 30</text>
<text x="40" y="92" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#F2F2F2">Deux postes, en même temps<tspan fill="#FF2B47">.</tspan></text>
