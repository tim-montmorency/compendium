<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1308 470" width="1308" height="470" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F2F2F2"/></marker></defs>
<title id="t">Déroulement des présentations devant le jury</title>
<desc id="d">Ligne du temps à deux pistes. Sur le poste de l'enseignante, en avant : l'étudiant A se met en place 3 minutes, présente 7 minutes, reçoit les commentaires du jury 1 minute 30. Il passe ensuite au portable de Marie-Michelle, en retrait, pour 3 minutes de questions de code. Pendant ces 3 minutes, l'étudiant B se met en place sur le poste de l'enseignante, puis présente. Un cycle dure 11 minutes 30.</desc>
