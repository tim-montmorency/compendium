<svg width="100%" viewBox="0 0 680 300" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Poppins, 'Segoe UI', -apple-system, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Charger les données du portfolio</title>
  <desc>Une source de données au choix (JSON local, Google Sheets ou Airtable) est lue par fetch() dans js/data.js. La fonction chargerProjets() retourne un tableau de projets dans le format commun. Ce tableau sert à js/main.js, qui génère les cartes de la page d'accueil, et au détail d'un projet : une modale (dans js/main.js) ou la page projet.html (avec js/projet.js).</desc>
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#ef5552" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Colonne 1 : source de données -->
  <rect x="10" y="30" width="170" height="240" rx="8" fill="#343850" stroke="#ef5552" stroke-width="1.5"/>
  <text x="95" y="58" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="14" font-weight="500">Source de données</text>
  <text x="95" y="80" text-anchor="middle" dominant-baseline="central" fill="#b0b3c1" font-size="11">une seule, au choix</text>

  <rect x="25" y="100" width="140" height="32" rx="16" fill="#272a35" stroke="#b0b3c1" stroke-width="0.75"/>
  <text x="95" y="116" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="12">JSON local</text>
  <rect x="25" y="144" width="140" height="32" rx="16" fill="#272a35" stroke="#b0b3c1" stroke-width="0.75"/>
  <text x="95" y="160" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="12">Google Sheets</text>
  <rect x="25" y="188" width="140" height="32" rx="16" fill="#272a35" stroke="#b0b3c1" stroke-width="0.75"/>
  <text x="95" y="204" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="12">Airtable</text>

  <text x="95" y="246" text-anchor="middle" dominant-baseline="central" fill="#ef5552" font-size="11" font-weight="500">une URL différente</text>

  <!-- Flèche 1 : fetch() -->
  <line x1="182" y1="150" x2="251" y2="150" stroke="#ef5552" stroke-width="1.5" marker-end="url(#fleche)"/>
  <text x="217" y="136" text-anchor="middle" dominant-baseline="central" fill="#b0b3c1" font-size="11" font-family="Consolas, 'Courier New', monospace">fetch()</text>

  <!-- Colonne 2 : js/data.js -->
  <rect x="255" y="90" width="170" height="120" rx="8" fill="#343850" stroke="#ef5552" stroke-width="1.5"/>
  <rect x="265" y="100" width="72" height="18" rx="9" fill="#272a35" stroke="#b0b3c1" stroke-width="0.5"/>
  <text x="301" y="109" text-anchor="middle" dominant-baseline="central" fill="#b0b3c1" font-size="9" font-family="Consolas, 'Courier New', monospace">js/data.js</text>
  <text x="340" y="140" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="13" font-weight="500" font-family="Consolas, 'Courier New', monospace">chargerProjets()</text>
  <text x="340" y="162" text-anchor="middle" dominant-baseline="central" fill="#b0b3c1" font-size="11">va chercher et uniformise</text>
  <text x="340" y="190" text-anchor="middle" dominant-baseline="central" fill="#ef5552" font-size="11" font-weight="500">seul fichier qui change</text>

  <!-- Flèches 2 : tableau de projets -->
  <line x1="427" y1="140" x2="496" y2="92" stroke="#ef5552" stroke-width="1.5" marker-end="url(#fleche)"/>
  <line x1="427" y1="160" x2="496" y2="208" stroke="#ef5552" stroke-width="1.5" marker-end="url(#fleche)"/>
  <text x="462" y="143" text-anchor="middle" dominant-baseline="central" fill="#b0b3c1" font-size="10">tableau</text>
  <text x="462" y="157" text-anchor="middle" dominant-baseline="central" fill="#b0b3c1" font-size="10">de projets</text>

  <!-- Colonne 3a : js/main.js -->
  <rect x="500" y="30" width="170" height="110" rx="8" fill="#343850" stroke="#ef5552" stroke-width="1.5"/>
  <rect x="510" y="40" width="72" height="18" rx="9" fill="#272a35" stroke="#b0b3c1" stroke-width="0.5"/>
  <text x="546" y="49" text-anchor="middle" dominant-baseline="central" fill="#b0b3c1" font-size="9" font-family="Consolas, 'Courier New', monospace">js/main.js</text>
  <text x="585" y="80" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="14" font-weight="500">Les cartes</text>
  <text x="585" y="102" text-anchor="middle" dominant-baseline="central" fill="#b0b3c1" font-size="11">page d'accueil</text>
  <text x="585" y="122" text-anchor="middle" dominant-baseline="central" fill="#ef5552" font-size="11" font-weight="500">même code pour tous</text>

  <!-- Colonne 3b : js/projet.js -->
  <rect x="500" y="160" width="170" height="110" rx="8" fill="#343850" stroke="#ef5552" stroke-width="1.5"/>
  <rect x="510" y="170" width="118" height="18" rx="9" fill="#272a35" stroke="#b0b3c1" stroke-width="0.5"/>
  <text x="569" y="179" text-anchor="middle" dominant-baseline="central" fill="#b0b3c1" font-size="9" font-family="Consolas, 'Courier New', monospace">main.js ou projet.js</text>
  <text x="585" y="210" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="14" font-weight="500">Le détail</text>
  <text x="585" y="232" text-anchor="middle" dominant-baseline="central" fill="#b0b3c1" font-size="11">modale ou projet.html</text>
  <text x="585" y="252" text-anchor="middle" dominant-baseline="central" fill="#ef5552" font-size="11" font-weight="500">même code pour tous</text>
</svg>
