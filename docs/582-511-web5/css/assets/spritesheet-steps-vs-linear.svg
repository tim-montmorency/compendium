<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Graphique : avec steps(8), la position avance en escalier, une image à la fois. Avec linear, elle avance en ligne droite, et la planche glisse entre deux images." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Graphique : avec steps(8), la position avance en escalier, une image à la fois. Avec linear, elle avance en ligne droite, et la planche glisse entre deux images.</title><rect width="900" height="400" fill="#0A0A0A"/><text x="40" y="34" fill="#F2F2F2" font-family="Poppins, system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Position de la planche dans le temps</text><line x1="90" y1="60" x2="90" y2="360" stroke="#8A8A8A" stroke-width="2"/><line x1="90" y1="360" x2="650" y2="360" stroke="#8A8A8A" stroke-width="2"/><text x="650" y="390" fill="#8A8A8A" font-family="Poppins, system-ui, sans-serif" font-size="14" font-weight="400" text-anchor="end">temps →</text><text x="78" y="68" fill="#8A8A8A" font-family="Poppins, system-ui, sans-serif" font-size="14" font-weight="400" text-anchor="end">image</text><text x="78" y="346.25" fill="#8A8A8A" font-family="Poppins, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="end">1</text><text x="78" y="308.75" fill="#8A8A8A" font-family="Poppins, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="end">2</text><text x="78" y="271.25" fill="#8A8A8A" font-family="Poppins, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="end">3</text><text x="78" y="233.75" fill="#8A8A8A" font-family="Poppins, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="end">4</text><text x="78" y="196.25" fill="#8A8A8A" font-family="Poppins, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="end">5</text><text x="78" y="158.75" fill="#8A8A8A" font-family="Poppins, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="end">6</text><text x="78" y="121.25" fill="#8A8A8A" font-family="Poppins, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="end">7</text><text x="78" y="83.75" fill="#8A8A8A" font-family="Poppins, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="end">8</text><polyline points="90.0,341.25 160.0,341.25 160.0,303.75 230.0,303.75 230.0,266.25 300.0,266.25 300.0,228.75 370.0,228.75 370.0,191.25 440.0,191.25 440.0,153.75 510.0,153.75 510.0,116.25 580.0,116.25 580.0,78.75 650.0,78.75" fill="none" stroke="#FF2B47" stroke-width="4"/><line x1="90" y1="341.25" x2="650" y2="78.75" stroke="#F2F2F2" stroke-width="2" stroke-dasharray="7 6"/><rect x="680" y="120" width="22" height="4" fill="#FF2B47"/><text x="712" y="127" fill="#FF2B47" font-family="Poppins, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">steps(8)</text><text x="712" y="149" fill="#F2F2F2" font-family="Poppins, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="start">un saut sec par image :</text><text x="712" y="167" fill="#F2F2F2" font-family="Poppins, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="start">on voit une image à la fois</text><line x1="680" y1="222" x2="702" y2="222" stroke="#F2F2F2" stroke-width="2" stroke-dasharray="7 6"/><text x="712" y="227" fill="#F2F2F2" font-family="Poppins, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">linear</text><text x="712" y="249" fill="#F2F2F2" font-family="Poppins, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="start">la planche glisse :</text><text x="712" y="267" fill="#F2F2F2" font-family="Poppins, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="start">on voit deux images à la fois</text></svg>