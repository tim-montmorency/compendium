<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-label="Deux barres sur l'axe du défilement. La timeline de la section va de 0 à 100 % pendant son passage dans l'écran. Celle de l'arrière-plan, plus grand, commence avant et finit après : son mouvement serait décalé par rapport à la section." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Pourquoi suivre la timeline de la section</title><rect width="880" height="300" fill="#0A0A0A"/><text x="40" y="36" fill="#F2F2F2" font-family="Poppins, system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Pourquoi suivre la section, et pas l'arrière-plan?</text><text x="40" y="116" fill="#FF2B47" font-family="Poppins, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">La section</text><rect x="250" y="98" width="400.0" height="24" fill="#FF2B47"/><text x="250" y="88" fill="#F2F2F2" font-family="Poppins, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">0 %</text><text x="650.0" y="88" fill="#F2F2F2" font-family="Poppins, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">100 %</text><text x="40" y="206" fill="#8A8A8A" font-family="Poppins, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">L'arrière-plan</text><rect x="210.0" y="188" width="480.0" height="24" fill="none" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="6 5"/><text x="210.0" y="178" fill="#8A8A8A" font-family="Poppins, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">0 %</text><text x="690.0" y="178" fill="#8A8A8A" font-family="Poppins, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">100 %</text><line x1="250" y1="126" x2="250" y2="230" stroke="#FF2B47" stroke-width="1.5" stroke-dasharray="3 4"/><line x1="650.0" y1="126" x2="650.0" y2="230" stroke="#FF2B47" stroke-width="1.5" stroke-dasharray="3 4"/><text x="206.0" y="244" fill="#8A8A8A" font-family="Poppins, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="end">commence avant</text><text x="694.0" y="244" fill="#8A8A8A" font-family="Poppins, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">finit après</text><line x1="250" y1="266" x2="650.0" y2="266" stroke="#F2F2F2" stroke-width="1.5"/><polygon points="650.0,262 658.0,266 650.0,270" fill="#F2F2F2"/><text x="450.0" y="286" fill="#F2F2F2" font-family="Poppins, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="middle">le défilement de la page</text></svg>