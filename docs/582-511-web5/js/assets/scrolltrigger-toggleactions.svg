<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-label="toggleActions reçoit quatre mots, un par événement, dans l'ordre : onEnter (start croise scroller-start en descendant), onLeave (end croise scroller-end en descendant), onEnterBack (end recroise scroller-end en remontant), onLeaveBack (start recroise scroller-start en remontant). Dans l'exemple : play, reverse, play, reverse." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Lire toggleActions</title>
<rect width="880" height="470" fill="#0A0A0A"/>
<text x="40" y="34" fill="#F2F2F2" font-family="Poppins, system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Lire toggleActions : un mot par événement</text>
<text x="40" y="60" fill="#8A8A8A" font-family="Poppins, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="start">Toujours dans le même ordre : 1, 2, 3, 4</text>
<text x="40" y="92" fill="#F2F2F2" font-family="ui-monospace, Consolas, monospace" font-size="15" font-weight="700" text-anchor="start">toggleActions: &quot;play reverse play reverse&quot;</text>
<rect x="85" y="105" width="100" height="32" rx="5" fill="none" stroke="#FF2B47" stroke-width="2"/>
<text x="135" y="127" fill="#9BD46A" font-family="ui-monospace, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle">play</text>
<text x="135" y="170" fill="#FF2B47" font-family="Poppins, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">1</text>
<line x1="135" y1="178" x2="135" y2="204" stroke="#FF2B47" stroke-width="2"/>
<rect x="295" y="105" width="100" height="32" rx="5" fill="none" stroke="#FF2B47" stroke-width="2"/>
<text x="345" y="127" fill="#9BD46A" font-family="ui-monospace, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle">reverse</text>
<text x="345" y="170" fill="#FF2B47" font-family="Poppins, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">2</text>
<line x1="345" y1="178" x2="345" y2="204" stroke="#FF2B47" stroke-width="2"/>
<rect x="505" y="105" width="100" height="32" rx="5" fill="none" stroke="#FF2B47" stroke-width="2"/>
<text x="555" y="127" fill="#9BD46A" font-family="ui-monospace, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle">play</text>
<text x="555" y="170" fill="#FF2B47" font-family="Poppins, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">3</text>
<line x1="555" y1="178" x2="555" y2="204" stroke="#FF2B47" stroke-width="2"/>
<rect x="715" y="105" width="100" height="32" rx="5" fill="none" stroke="#FF2B47" stroke-width="2"/>
<text x="765" y="127" fill="#9BD46A" font-family="ui-monospace, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle">reverse</text>
<text x="765" y="170" fill="#FF2B47" font-family="Poppins, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">4</text>
<line x1="765" y1="178" x2="765" y2="204" stroke="#FF2B47" stroke-width="2"/>
<rect x="40" y="204" width="190" height="236" rx="8" fill="#1C1D21"/>
<text x="135" y="236" fill="#F2F2F2" font-family="ui-monospace, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle">onEnter</text>
<text x="135" y="300" fill="#2ECC71" font-family="Poppins, system-ui, sans-serif" font-size="44" font-weight="700" text-anchor="middle">↓</text>
<text x="135" y="330" fill="#8A8A8A" font-family="Poppins, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="middle">en descendant</text>
<text x="135" y="368" fill="#F2F2F2" font-family="ui-monospace, Consolas, monospace" font-size="13" font-weight="400" text-anchor="middle"><tspan fill="#2ECC71" font-weight="700">start</tspan> croise</text>
<text x="135" y="388" fill="#2ECC71" font-family="ui-monospace, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">scroller-start</text>
<text x="135" y="420" fill="#8A8A8A" font-family="Poppins, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="middle">il entre</text>
<rect x="250" y="204" width="190" height="236" rx="8" fill="#1C1D21"/>
<text x="345" y="236" fill="#F2F2F2" font-family="ui-monospace, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle">onLeave</text>
<text x="345" y="300" fill="#FF2B47" font-family="Poppins, system-ui, sans-serif" font-size="44" font-weight="700" text-anchor="middle">↓</text>
<text x="345" y="330" fill="#8A8A8A" font-family="Poppins, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="middle">en descendant</text>
<text x="345" y="368" fill="#F2F2F2" font-family="ui-monospace, Consolas, monospace" font-size="13" font-weight="400" text-anchor="middle"><tspan fill="#FF2B47" font-weight="700">end</tspan> croise</text>
<text x="345" y="388" fill="#FF2B47" font-family="ui-monospace, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">scroller-end</text>
<text x="345" y="420" fill="#8A8A8A" font-family="Poppins, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="middle">il sort par le haut</text>
<rect x="460" y="204" width="190" height="236" rx="8" fill="#1C1D21"/>
<text x="555" y="236" fill="#F2F2F2" font-family="ui-monospace, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle">onEnterBack</text>
<text x="555" y="300" fill="#FF2B47" font-family="Poppins, system-ui, sans-serif" font-size="44" font-weight="700" text-anchor="middle">↑</text>
<text x="555" y="330" fill="#8A8A8A" font-family="Poppins, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="middle">en remontant</text>
<text x="555" y="368" fill="#F2F2F2" font-family="ui-monospace, Consolas, monospace" font-size="13" font-weight="400" text-anchor="middle"><tspan fill="#FF2B47" font-weight="700">end</tspan> croise</text>
<text x="555" y="388" fill="#FF2B47" font-family="ui-monospace, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">scroller-end</text>
<text x="555" y="420" fill="#8A8A8A" font-family="Poppins, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="middle">il revient par le haut</text>
<rect x="670" y="204" width="190" height="236" rx="8" fill="#1C1D21"/>
<text x="765" y="236" fill="#F2F2F2" font-family="ui-monospace, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle">onLeaveBack</text>
<text x="765" y="300" fill="#2ECC71" font-family="Poppins, system-ui, sans-serif" font-size="44" font-weight="700" text-anchor="middle">↑</text>
<text x="765" y="330" fill="#8A8A8A" font-family="Poppins, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="middle">en remontant</text>
<text x="765" y="368" fill="#F2F2F2" font-family="ui-monospace, Consolas, monospace" font-size="13" font-weight="400" text-anchor="middle"><tspan fill="#2ECC71" font-weight="700">start</tspan> croise</text>
<text x="765" y="388" fill="#2ECC71" font-family="ui-monospace, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">scroller-start</text>
<text x="765" y="420" fill="#8A8A8A" font-family="Poppins, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="middle">il ressort par le bas</text>
</svg>